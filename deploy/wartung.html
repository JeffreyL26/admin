    padding: 24px;
    background: #f5f6f8;
    color: #1a2233;
    font: 16px/1.6 'Segoe UI', system-ui, -apple-system, sans-serif;

  main { max-width: 34rem; text-align: center; }

  p { margin: 0 0 12px; color: #4a5568; }
  .hint { font-size: 0.875rem; color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e6e8ec; }
    p { color: #a8b0bd; }
    .hint { color: #8a94a3; }
  }
</style>
</head>
<body>
<main>
  <h1>oHRganize ist gerade nicht erreichbar</h1>
  <p>

  </p>
  <p>Bitte versuchen Sie es in wenigen Minuten erneut.</p>
