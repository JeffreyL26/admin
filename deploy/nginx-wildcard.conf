# oHRganize — Reverse-Proxy für den Mehrkunden-Betrieb (<kunde>.ohrganize.com)
#
# Ablage:  /etc/nginx/conf.d/ohrganize-wildcard.conf
# Snippet: deploy/nginx-security-headers.conf → /etc/nginx/snippets/ohrganize-security-headers.conf
# Map:     /etc/nginx/ohrganize-kunden.map  (erzeugt ohrganize-provision.sh)
# Prüfen:  nginx -t && systemctl reload nginx
#
# VOR DEM AUSROLLEN ERSETZEN:
#   ohrganize.com        → eigene Basisdomain (kommt auch in den Zertifikatspfaden vor)
#   /srv/ohrganize-web   → Zielverzeichnis des Portal-Builds (apps/web/dist)
#
# Aufbau: EIN server-Block für alle Kunden. Die Subdomain entscheidet, welche
# Backend-Instanz antwortet; nachgeschlagen wird sie in der Map-Datei, die
# ohrganize-provision.sh pflegt. Das Portal-Build ist für alle Kunden dasselbe
# Verzeichnis — es spricht die API same-origin an und enthält nichts
# Kundenspezifisches.
#
# WARUM NICHT ein server-Block je Kunde: Bei dreißig Kunden wären das dreißig
# nahezu identische Dateien; eine Änderung an den Zeitgrenzen oder Kopfzeilen
# müsste dreißigmal nachgezogen werden, und beim ersten Vergessen läuft ein
# Kunde mit anderen Regeln. Ein Kunde mehr ist hier eine Zeile mehr in der Map.
#
# Diese Datei kann NEBEN nginx.conf (Einfachkunde, eigene Domain) liegen —
# nachgemessen auf nginx 1.26.3. Dafür tragen alle benannten Zonen und Formate
# hier den Zusatz _wc (zwei log_format mit demselben Namen ließen nginx nicht
# starten), und einfache Direktiven wie limit_req_status stehen im server-Block
# statt auf http-Ebene, wo sie sich nicht wiederholen dürfen.


# ---------------------------------------------------------------------------
# Zugriffsprotokoll OHNE Query-String, MIT Kundenname
# ---------------------------------------------------------------------------
# $uri statt $request: Download-Links tragen ihre Signatur im Query-String und
# stünden sonst im Klartext im Logfile (siehe nginx.conf, ausführliche
# Begründung dort). $host kommt hinzu, weil in dieser Datei alle Kunden in
# dasselbe Log schreiben — ohne den Namen ließe sich eine Zeile keinem Kunden
# mehr zuordnen. Filtern dann mit: grep ' musterfirma.ohrganize.com ' …
#
# Getrennte Logdateien je Kunde (access_log mit Variable im Pfad) sind bewusst
# NICHT konfiguriert: nginx hält dann je Wert eine offene Datei, und die
# Rotation müsste jeden neuen Kunden kennen.
log_format ohrganize_wc '$remote_addr - $remote_user [$time_local] $host '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent" rt=$request_time';

# ---------------------------------------------------------------------------
# Zweite Schicht gegen Passwort-Durchprobieren
# ---------------------------------------------------------------------------
# Die eigentliche Drosselung sitzt im Backend (je Konto und je IP). Diese Zone
# fängt die Last vor Node ab — bcrypt rechnet je Versuch rund 65 ms und
# blockiert dabei den einzigen Node-Prozess DIESES Kunden.
#
# Schlüssel ist IP + Subdomain, nicht nur die IP: Sonst würde ein
# Durchprobieren gegen Kunde A das Anmeldefenster von Kunde B mit zudrücken,
# obwohl die beiden nichts miteinander zu tun haben. Ein Angreifer, der
# mehrere Kunden gleichzeitig angeht, bekommt damit zwar je Ziel ein eigenes
# Kontingent — die Grenze, die zählt, ist ohnehin die im Backend.
#
# 60r/m ist großzügig gewählt, weil hinter dem Firmen-NAT alle Arbeitsplätze
# eines Kunden dieselbe IP haben.
limit_req_zone $binary_remote_addr$host zone=ohrganize_login_wc:10m rate=60r/m;

# ---------------------------------------------------------------------------
# Subdomain → Backend-Instanz
# ---------------------------------------------------------------------------
# Die eingebundene Datei enthält je Kunde eine Zeile:
#   musterfirma.ohrganize.com 127.0.0.1:3101;
#
# Sie MUSS existieren, sonst startet nginx nicht — einmalig anlegen:
#   touch /etc/nginx/ohrganize-kunden.map
# Gepflegt wird sie ausschließlich von ohrganize-provision.sh; von Hand
# geänderte Zeilen gehen beim nächsten Lauf nicht verloren, aber Port und
# env-Datei laufen dann leicht auseinander.
#
# Die Datei liegt bewusst NICHT in conf.d/: Alles mit der Endung .conf wird
# dort als eigenständige Konfiguration eingelesen, und eine Sammlung von
# Map-Zeilen ohne umschließenden Block ist das nicht.
map $host $ohrganize_backend {
    default "";
    include /etc/nginx/ohrganize-kunden.map;
}


# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
# Kein ACME-Block: Das Wildcard-Zertifikat wird über DNS-01 ausgestellt
# (siehe deploy/README.md), dafür braucht Let's Encrypt keinen HTTP-Zugriff.
server {
    listen 80;
    listen [::]:80;
    server_name *.ohrganize.com;

    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------------
# Portal + API, ein Block für alle Kunden
# ---------------------------------------------------------------------------
server {
    # http2 steht in der listen-Zeile statt in der Direktive `http2 on;`:
    # Die Direktive gibt es erst ab nginx 1.25.1. Debian 12 liefert 1.22,
    # Ubuntu 22.04 liefert 1.18 und 24.04 liefert 1.24 — auf allen drei
    # dokumentierten Zielsystemen scheitert `nginx -t` sonst mit
    # "unknown directive http2". Diese Schreibweise funktioniert von 1.9.5
    # bis heute; ab 1.25.1 warnt nginx, dass sie veraltet ist, und aktiviert
    # HTTP/2 trotzdem (auf 1.26.3 nachgemessen).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.ohrganize.com;

    access_log /var/log/nginx/ohrganize-wildcard.access.log ohrganize_wc;
    error_log  /var/log/nginx/ohrganize-wildcard.error.log warn;

    # -----------------------------------------------------------------------
    # TLS — Wildcard-Zertifikat
    # -----------------------------------------------------------------------
    # Ausgestellt über DNS-01, weil ein Wildcard-Name anders nicht zu bekommen
    # ist (HTTP-01 kann *.ohrganize.com nicht belegen):
    #   certbot certonly --dns-<anbieter> \
    #     --dns-<anbieter>-credentials /etc/letsencrypt/dns.ini \
    #     -d '*.ohrganize.com' -d ohrganize.com
    #
    # Der Zertifikatspfad trägt den Namen der Basisdomain, NICHT den Stern.
    # Bei einem bestehenden Einzelzertifikat legt certbot sonst -0001-Ordner an;
    # nach einer Erneuerung zeigt der Pfad dann auf das falsche Zertifikat.
    ssl_certificate     /etc/letsencrypt/live/ohrganize.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohrganize.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ohrganize.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:OHRGANIZE_TLS_WC:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # Steht im server-Block, nicht auf http-Ebene: Anders als eine benannte
    # Zone ist limit_req_status eine einfache Direktive und darf je Kontext nur
    # EINMAL vorkommen. Auf http-Ebene kollidierte sie mit derselben Zeile in
    # nginx.conf, sobald beide Dateien in conf.d liegen — nginx bricht dann mit
    # "limit_req_status directive is duplicate" ab (im Testlauf passiert).
    limit_req_status 429;

    include /etc/nginx/snippets/ohrganize-security-headers.conf;

    # -----------------------------------------------------------------------
    # Unbekannte Subdomain
    # -----------------------------------------------------------------------
    # Ein Wildcard-Zertifikat beantwortet JEDEN Namen unter der Basisdomain —
    # auch getippte, geratene und längst gekündigte. Ohne diese Sperre liefe
    # so eine Anfrage in ein proxy_pass mit leerem Ziel und endete als 500;
    # 404 ist die ehrlichere Antwort und taucht nicht als Serverfehler im
    # Monitoring auf.
    #
    # `if` an dieser Stelle ist einer der ausdrücklich unbedenklichen Fälle
    # (ein `return` direkt im server-Block).
    if ($ohrganize_backend = "") {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Statisches Portal-Build — für alle Kunden dasselbe
    # -----------------------------------------------------------------------
    # Der Build enthält keine kundenspezifischen Werte: Die API wird
    # same-origin über den jeweils aufgerufenen Namen angesprochen
    # (API_BASE = '' in apps/web/src/api/client.ts). Ein Kunde mehr braucht
    # deshalb KEIN eigenes Build.
    root /srv/ohrganize-web;
    index index.html;

    client_max_body_size 12m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # -----------------------------------------------------------------------
    # Anmeldung — gedrosselt
    # -----------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=ohrganize_login_wc burst=30 nodelay;

        include /etc/nginx/snippets/ohrganize-security-headers.conf;
        # proxy_pass mit Variable und OHNE Pfadangabe: nginx reicht die
        # ursprüngliche URI unverändert weiter. Da in der Map eine IP mit Port
        # steht (kein Name), wird kein resolver gebraucht.
        proxy_pass http://$ohrganize_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ÜBERSCHREIBEN, nicht anhängen: Das Backend nimmt den ersten Eintrag
        # als Herkunft; ein vom Client erfundener Wert davor würde die
        # Login-Drosselung aushebeln.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # -----------------------------------------------------------------------
    # API
    # -----------------------------------------------------------------------
    location /api/ {
        # HR-Uploads (Verträge, Zeugnisse) dürfen bis 50 MB groß sein.
        client_max_body_size 55m;

        include /etc/nginx/snippets/ohrganize-security-headers.conf;
        proxy_pass http://$ohrganize_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Das Backend bricht Anfragen nach 60 s selbst ab; die Grenzen hier
        # liegen darüber, damit dessen Meldung ankommt und nicht die
        # 504-Seite von nginx.
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Antworten der API nie zwischenspeichern — es sind Personaldaten.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Build-Artefakte des Portals
    # -----------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/ohrganize-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA-Fallback
    # -----------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/ohrganize-security-headers.conf;
        # index.html nie zwischenspeichern, sonst zeigt der Browser nach einem
        # Update weiter auf alte Asset-Dateien.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
