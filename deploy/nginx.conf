# HRMONIC — Reverse-Proxy (nginx)
#
# Ablage:  /etc/nginx/conf.d/hrmonic.conf
#          (conf.d wird innerhalb von http{} eingebunden — log_format und
#           limit_req_zone dürfen deshalb hier stehen)
# Snippet: deploy/nginx-security-headers.conf → /etc/nginx/snippets/hrmonic-security-headers.conf
# Prüfen:  nginx -t && systemctl reload nginx
#
# VOR DEM AUSROLLEN ERSETZEN:
#   portal.firma.de        → eigene Domain (kommt auch in den Zertifikatspfaden vor)
#   /srv/hrmonic-web       → Zielverzeichnis des Portal-Builds (apps/web/dist)
#
# Aufbau: Eine Maschine, TLS endet hier, /api/* geht an das Backend auf
# 127.0.0.1:3001, alles andere ist das statische Portal-Build.


# ---------------------------------------------------------------------------
# Zugriffsprotokoll OHNE Query-String
# ---------------------------------------------------------------------------
# Wogegen das schützt: Download-Links werden signiert und tragen die Signatur
# im Query-String (?expires=…&sig=…). Das Standardformat "combined" schreibt
# mit $request die vollständige Zeile inklusive Query mit — die signierten
# Links auf Verträge und AU-Bescheinigungen stünden damit im Klartext im
# Logfile, das oft weiter kopiert wird als die Daten selbst.
# $uri enthält nur den Pfad. Nicht auf $request oder $request_uri zurückändern.
log_format hrmonic '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent" rt=$request_time';

# ---------------------------------------------------------------------------
# Zweite Schicht gegen Passwort-Durchprobieren
# ---------------------------------------------------------------------------
# Die eigentliche Drosselung sitzt im Backend (je Konto und je IP, gleitendes
# Fenster). Diese Zone hier fängt die Last schon vor Node ab — bcrypt rechnet
# je Versuch rund 65 ms und blockiert dabei den einzigen Node-Prozess.
#
# 60r/m klingt großzügig, ist es aber nicht: Hinter dem Firmen-NAT teilen sich
# ALLE Arbeitsplätze eine IP. Bei 40 Beschäftigten, die morgens zeitgleich
# anmelden, sperrt ein knapper Wert das ganze Haus aus. Wer die Zahl senkt,
# muss vorher wissen, wie viele Anmeldungen aus einer Quelladresse kommen.
limit_req_zone $binary_remote_addr zone=hrmonic_login:10m rate=60r/m;
limit_req_status 429;


# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.firma.de;

    # ACME-Erneuerung (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.firma.de;

    access_log /var/log/nginx/hrmonic.access.log hrmonic;
    error_log  /var/log/nginx/hrmonic.error.log warn;

    # -----------------------------------------------------------------------
    # TLS
    # -----------------------------------------------------------------------
    # Pfade aus certbot/Let's Encrypt:
    #   certbot certonly --webroot -w /var/www/certbot -d portal.firma.de
    ssl_certificate     /etc/letsencrypt/live/portal.firma.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.firma.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/portal.firma.de/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:HRMONIC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Version des Webservers nicht ausplaudern.
    server_tokens off;

    include /etc/nginx/snippets/hrmonic-security-headers.conf;

    # -----------------------------------------------------------------------
    # Statisches Portal-Build (apps/web/dist)
    # -----------------------------------------------------------------------
    root /srv/hrmonic-web;
    index index.html;

    # Portal-Uploads (Krankmeldungen, eigene Dokumente) sind auf 10 MB
    # begrenzt; etwas Luft für den Multipart-Rahmen.
    client_max_body_size 12m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # -----------------------------------------------------------------------
    # Anmeldung — gedrosselt
    # -----------------------------------------------------------------------
    # Exakte Übereinstimmung, gewinnt gegen das Präfix /api/ darunter.
    location = /api/auth/login {
        limit_req zone=hrmonic_login burst=30 nodelay;

        include /etc/nginx/snippets/hrmonic-security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For wird ÜBERSCHRIEBEN, nicht ergänzt
        # ($proxy_add_x_forwarded_for hängt an, was der Client mitgeschickt hat).
        # Das Backend läuft mit trustProxy und nimmt den ersten Eintrag als
        # Herkunft. Würde ein vom Client erfundener Wert davorstehen, könnte
        # sich jeder Angreifer bei jedem Versuch eine neue IP ausdenken und die
        # Drosselung liefe ins Leere. Nicht auf $proxy_add_x_forwarded_for
        # umstellen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # -----------------------------------------------------------------------
    # API
    # -----------------------------------------------------------------------
    location /api/ {
        # HR-Uploads (Verträge, Zeugnisse) dürfen bis 50 MB groß sein.
        client_max_body_size 55m;

        include /etc/nginx/snippets/hrmonic-security-headers.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Siehe Begründung oben — überschreiben, nicht anhängen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Das Backend bricht Anfragen nach 60 s selbst ab (requestTimeout).
        # Die Proxy-Zeitgrenzen liegen bewusst darüber, damit im Fehlerfall die
        # Meldung des Backends ankommt und nicht die 504-Seite von nginx.
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Antworten der API nie zwischenspeichern — es sind Personaldaten.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Build-Artefakte des Portals
    # -----------------------------------------------------------------------
    # Die Dateinamen enthalten einen Inhalts-Hash (index-BEcROrkS.js), sind
    # also unveränderlich und dürfen lange im Browser-Cache liegen.
    location /assets/ {
        include /etc/nginx/snippets/hrmonic-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA-Fallback
    # -----------------------------------------------------------------------
    # Das Portal benutzt BrowserRouter: /kalender, /dokumente usw. sind keine
    # Dateien. Ohne diese Umschreibung liefert ein Neuladen (oder ein
    # Lesezeichen) einen 404.
    location / {
        include /etc/nginx/snippets/hrmonic-security-headers.conf;
        # index.html darf NICHT zwischengespeichert werden, sonst zeigt der
        # Browser nach einem Update weiter auf die alten Asset-Dateien.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
