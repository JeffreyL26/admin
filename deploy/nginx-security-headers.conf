# HRMONIC — Sicherheitskopfzeilen (von nginx.conf eingebunden)
#
# Ablage: /etc/nginx/snippets/hrmonic-security-headers.conf
#
# ACHTUNG, nginx-Eigenheit: add_header wird NICHT zusammengeführt. Sobald ein
# location-Block ein eigenes add_header enthält, verliert er ALLE add_header des
# übergeordneten Blocks. Deshalb liegen die Kopfzeilen in dieser Datei und
# werden in jedem Block eingebunden, der zusätzliche Kopfzeilen setzt.
# "always" sorgt dafür, dass sie auch auf Fehlerantworten (4xx/5xx) stehen.

# HSTS: Der Browser spricht diese Domain danach ausschließlich über HTTPS an.
# Erst einschalten, wenn TLS steht und funktioniert — die Zusage gilt zwei
# Jahre und lässt sich nicht kurzfristig zurücknehmen. includeSubDomains nur
# setzen, wenn wirklich JEDE Subdomain HTTPS spricht.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Kein MIME-Sniffing. Downloads liefert das Backend zwar immer als
# Content-Disposition: attachment aus, aber der Browser soll auch bei
# statischen Dateien nicht raten.
add_header X-Content-Type-Options "nosniff" always;

# Keine Referrer an fremde Ziele. Signierte Download-Links stehen im
# Query-String; ohne diese Zeile könnten sie über einen externen Link
# abfließen.
add_header Referrer-Policy "no-referrer" always;

# Das Portal wird nirgends eingebettet. frame-ancestors deckt das ab,
# X-Frame-Options ist die Absicherung für ältere Browser.
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy für das Portal-Build (apps/web/dist).
# Belegt am tatsächlichen Build:
#   script-src 'self'      Vite erzeugt genau eine Modul-Datei, kein Inline-Skript.
#   style-src  'unsafe-inline' React/Portal setzen Stile zur Laufzeit; das
#                          betrifft nur Stile, Skripte bleiben streng.
#   font-src   'self'      Inter liegt als woff2 im Build (@fontsource), es wird
#                          KEINE externe Schriftquelle geladen.
#   img-src    data:       für Inline-SVG/Canvas (Organigramm).
#   connect-src 'self'     Die API läuft same-origin über diesen Proxy. Liegt
#                          sie auf einer anderen Domain, muss diese hier ergänzt
#                          werden (und HRMONIC_CORS_ORIGIN gesetzt sein).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
