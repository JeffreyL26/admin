# Modul Abwesenheitsmanagement — Pfade (Merge via npm run openapi -w apps/backend).
paths:
  /api/absences/types:
    get:
      summary: Abwesenheitsarten auflisten (inkl. deaktivierter)
      responses:
        "200": { description: Liste der Arten }
    post:
      summary: Abwesenheitsart anlegen
      responses:
        "201": { description: Art angelegt }
        "400":
          description: Ungültige Eingaben
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/types/allowed:
    get:
      summary: Arten, die eine Person beantragen darf (Rollen-Allowlist plus Personenregeln, wie der Portal-Lesefilter)
      parameters:
        - { name: employee_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ employee_id, type_ids: [integer] }" }
        "400":
          description: employee_id fehlt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Person nicht gefunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/types/{id}:
    put:
      summary: Abwesenheitsart bearbeiten
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Aktualisierte Art }
        "404":
          description: Art nicht gefunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Abwesenheitsart löschen (nur wenn unbenutzt)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
        "409":
          description: Art wird verwendet — stattdessen deaktivieren
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/requests:
    get:
      summary: Abwesenheitsanträge auflisten
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [beantragt, genehmigt, abgelehnt, storniert] } }
        - { name: type_id, in: query, schema: { type: integer } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Antragsliste (mit Mitarbeiter- und Art-Daten) }
    post:
      summary: Antrag stellvertretend erfassen (Auto-Genehmigung bei Arten ohne Genehmigungspflicht oder mit approve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, type_id, date_from, date_to]
              properties:
                employee_id: { type: integer }
                type_id: { type: integer }
                date_from: { type: string, format: date }
                date_to: { type: string, format: date }
                half_day_start: { type: boolean }
                half_day_end: { type: boolean }
                comment: { type: string, maxLength: 2000 }
                override_balance: { type: boolean, description: Saldopruefung uebersteuern (nur HR) }
                approve: { type: boolean, description: "Nachtraegliche Erfassung, sofort genehmigt (nur HR, nie fuer die eigene Abwesenheit)" }
      responses:
        "201": { description: "Antrag angelegt, days_counted berechnet" }
        "403":
          description: approve fuer die eigene Abwesenheit (Vier-Augen-Prinzip) oder Art fuer die Person nicht freigegeben
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Ungültiger Zeitraum, keine zählbaren Arbeitstage oder Kategorie krankheit (Krankmeldung nutzen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Überschneidung mit bestehender Abwesenheit oder Jahresobergrenze der Art überschritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/preview:
    get:
      summary: Live-Vorschau der gezählten Tage (Arbeitstage minus Feiertage minus Betriebsruhe, halbe Randtage)
      parameters:
        - { name: employee_id, in: query, required: true, schema: { type: integer } }
        - { name: date_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: true, schema: { type: string, format: date } }
        - { name: half_day_start, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: half_day_end, in: query, schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200": { description: "{ days_counted, bundesland }" }
  /api/absences/requests/{id}/approve:
    post:
      summary: Antrag genehmigen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Genehmigter Antrag }
        "409":
          description: Antrag ist nicht im Status beantragt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/requests/{id}/reject:
    post:
      summary: Antrag ablehnen (Begründung erforderlich)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Abgelehnter Antrag }
        "400":
          description: Begründung fehlt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Antrag ist nicht im Status beantragt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/requests/{id}/cancel:
    post:
      summary: Antrag stornieren (beantragt oder genehmigt)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Stornierter Antrag }
        "409":
          description: Antrag kann nicht mehr storniert werden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/balance/{employeeId}/{year}:
    get:
      summary: Urlaubssaldo (Anspruch anteilig gezwölftelt, Übertrag mit Verfallsstichtag, genommen, verplant, Rest) samt Aufschlüsselung je Antrag
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
        - { name: year, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Saldo des Mitarbeitenden }
  /api/absences/balances/{year}:
    get:
      summary: Saldenübersicht aller aktiven Mitarbeitenden eines Jahres
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Salden inkl. Verfallsstichtag }
  /api/absences/sick-notes:
    get:
      summary: Krankmeldungen auflisten
      parameters:
        - { name: child_sick, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200": { description: Krankmeldungen mit Antrags- und Mitarbeiterdaten }
    post:
      summary: Krankmeldung erfassen (legt intern den Abwesenheitsantrag an; AU-Frist = 3. Kalendertag)
      responses:
        "201": { description: Krankmeldung angelegt }
        "400":
          description: Ungültige Eingaben oder unbekannte Erstbescheinigung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Überschneidung mit bestehender Abwesenheit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/absences/sick-notes/missing:
    get:
      summary: Fehlende AU-Bescheinigungen (Frist überschritten, kein Upload)
      responses:
        "200": { description: Überfällige Krankmeldungen }
  /api/absences/sick-notes/{id}:
    patch:
      summary: AU-Bescheinigung nachtragen (Datei, Eingangsdatum)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Aktualisierte Krankmeldung }
  /api/absences/closures:
    get:
      summary: Betriebsruhetage auflisten
      responses:
        "200": { description: Liste der Betriebsruhen }
    post:
      summary: Betriebsruhe anlegen; days_counted der ueberlappenden offenen und genehmigten Antraege (sowie abgeschlossener mit closure_covered = 1) wird neu berechnet
      responses:
        "201": { description: "{ closure, recounted_requests }" }
  /api/absences/closures/{id}:
    delete:
      summary: Betriebsruhe löschen; days_counted der ueberlappenden offenen und genehmigten Antraege (sowie abgeschlossener mit closure_covered = 1) wird neu berechnet
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
  /api/absences/calendar:
    get:
      summary: Abwesenheitskalender (Monat oder Jahr) inkl. Feiertagen je Bundesland, Betriebsruhe und Team-Konflikten (> 50 % gleichzeitig abwesend; Feiertage der Person und Betriebsruhe zaehlen nicht)
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: team_id, in: query, schema: { type: integer } }
      responses:
        "200": { description: Kalenderdaten je Mitarbeiter + Konfliktliste }
