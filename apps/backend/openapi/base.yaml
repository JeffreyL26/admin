# oHRganize API — Basisdefinition.
# Die Fachmodule pflegen ihre Pfade in openapi/<modul>.paths.yaml;
# `npm run openapi -w apps/backend` erzeugt daraus openapi.generated.yaml.
#
# Endpunkte mit `x-status: planned` sind für den späteren Mitarbeitenden-
# Web-Client reserviert: benannt und spezifiziert, aber noch nicht implementiert.
openapi: 3.1.0
info:
  title: oHRganize API
  version: 1.0.0
  description: >
    Client-agnostische REST-API für oHRganize. Genutzt vom Desktop-Client
    (HR-Administration, role "admin") und vom Mitarbeitenden-Web-Portal
    (Self-Service, role "mitarbeiter"). Zugriffsprüfung erfolgt ausschließlich
    im Backend: Accounts mit role "mitarbeiter" erreichen nur /api/auth/* und
    /api/me/*; alle übrigen Routen antworten für sie mit 403 FORBIDDEN.
servers:
  - url: http://127.0.0.1:3001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Health-Check
      security: []
      responses:
        "200": { description: OK }
  /api/auth/login:
    post:
      summary: Anmeldung (HR-Administration und Mitarbeitenden-Portal)
      security: []
      responses:
        "200": { description: "Token und Benutzer { id, email, name, role, employee_id }" }
        "401":
          description: Ungültige Zugangsdaten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/me:
    get:
      summary: Angemeldeter Benutzer
      responses:
        "200": { description: Benutzer }
  /api/files/{id}/download:
    get:
      summary: Datei-Download über kurzlebige signierte URL (beide Clients identisch)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Dateiinhalt }

  # ---------------------------------------------------------------------------
  # Self-Service-Endpunkte des Mitarbeitenden-Web-Portals (/api/me/*).
  # Alle Routen setzen einen Account mit verknüpftem Personalprofil voraus
  # (users.employee_id) und liefern ausschließlich eigene Daten.
  # Einträge mit x-status: planned sind weiterhin nur reserviert.
  # ---------------------------------------------------------------------------
  /api/me/profile:
    get:
      summary: Eigene Stammdaten lesen (ohne Bank-/Steuerdaten)
      responses:
        "200": { description: "{ profile } inkl. Abteilungs-/Team-/Standortnamen" }
        "403":
          description: Kein verknüpftes oder kein aktives Personalprofil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      x-status: planned
      summary: Eigene Stammdaten teilweise ändern (Kontaktdaten, Adresse, Bankverbindung)
      responses: { "200": { description: Aktualisierte Stammdaten } }
  /api/me/documents:
    get:
      x-status: planned
      summary: Eigene Dokumente auflisten
      responses: { "200": { description: Dokumentliste } }
  /api/me/leave-types:
    get:
      summary: Beantragbare Abwesenheitsarten (aktiv, ohne Kategorie Krankheit)
      responses:
        "200": { description: "{ types }" }
  /api/me/leave-requests:
    get:
      summary: Eigene Abwesenheitsanträge einsehen
      parameters:
        - { name: year, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ requests } inkl. type_name/type_color/decided_by_name" }
    post:
      summary: Abwesenheit beantragen (Urlaub/Sonderabwesenheit)
      responses:
        "201": { description: "{ request } — bei genehmigungsfreien Arten direkt genehmigt" }
        "409":
          description: Überschneidung oder Jahresobergrenze überschritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/leave-requests/{id}/cancel:
    post:
      summary: Eigenen, noch offenen Antrag zurückziehen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ request } mit Status storniert" }
        "409":
          description: Antrag ist nicht mehr offen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/leave-balance:
    get:
      summary: Eigenen Urlaubssaldo einsehen
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: "{ balance }" }
  /api/me/leave-preview:
    get:
      summary: Live-Vorschau der gezählten Tage für das Antragsformular
      parameters:
        - { name: date_from, in: query, required: true, schema: { type: string } }
        - { name: date_to, in: query, required: true, schema: { type: string } }
        - { name: half_day_start, in: query, required: false, schema: { type: string } }
        - { name: half_day_end, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ days_counted, bundesland }" }
  /api/me/sick-notes:
    get:
      summary: Eigene Krankmeldungen einsehen (inkl. AU-Frist)
      responses:
        "200": { description: "{ sick_notes }" }
    post:
      summary: Krankmeldung einreichen (AU-Nachweis reicht die HR nach)
      responses:
        "201": { description: "{ sick_note } inkl. certificate_due_date" }
  /api/me/team-calendar:
    get:
      x-status: planned
      summary: Abwesenheitskalender des eigenen Teams
      responses: { "200": { description: Kalenderdaten } }
  /api/me/goals:
    get:
      x-status: planned
      summary: Eigene Ziele und Fortschritt einsehen
      responses: { "200": { description: Zielliste } }
  /api/me/reviews:
    get:
      x-status: planned
      summary: Eigene Beurteilungen einsehen
      responses: { "200": { description: Beurteilungen } }
  /api/me/announcements:
    get:
      x-status: planned
      summary: Ankündigungen lesen
      responses: { "200": { description: Ankündigungen } }
  /api/me/announcements/{id}/ack:
    post:
      x-status: planned
      summary: Ankündigung als gelesen bestätigen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Bestätigt } }
  /api/me/surveys:
    get:
      x-status: planned
      summary: Offene Umfragen auflisten
      responses: { "200": { description: Umfragen } }
  /api/me/surveys/{id}/response:
    post:
      x-status: planned
      summary: An Umfrage teilnehmen (anonym ausgewertet)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { "201": { description: Teilnahme gespeichert } }
