# oHRganize API — Basisdefinition.
# Die Fachmodule pflegen ihre Pfade in openapi/<modul>.paths.yaml;
# `npm run openapi -w apps/backend` erzeugt daraus openapi.generated.yaml.
#
# Endpunkte mit `x-status: planned` sind für den späteren Mitarbeitenden-
# Web-Client reserviert: benannt und spezifiziert, aber noch nicht implementiert.
openapi: 3.1.0
info:
  title: oHRganize API
  version: 1.0.0
  description: >
    Client-agnostische REST-API für oHRganize. Genutzt vom Desktop-Client
    (HR-Administration, role "admin") und vom Mitarbeitenden-Web-Portal
    (Self-Service, role "mitarbeiter"). Zugriffsprüfung erfolgt ausschließlich
    im Backend: Accounts mit role "mitarbeiter" erreichen nur /api/auth/* und
    /api/me/*; alle übrigen Routen antworten für sie mit 403 FORBIDDEN.
servers:
  - url: http://127.0.0.1:3001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Health-Check
      security: []
      responses:
        "200": { description: OK }
  /api/auth/login:
    post:
      summary: Anmeldung (HR-Administration und Mitarbeitenden-Portal)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                client:
                  type: string
                  enum: [desktop, portal]
                  description: >-
                    Sitzungsart des Tokens (Vorgabe portal). desktop gilt nur fuer
                    Konten mit role admin und laeuft OHRGANIZE_DESKTOP_TOKEN_TTL
                    (Vorgabe 3d), portal OHRGANIZE_TOKEN_TTL (Vorgabe 1h).
      responses:
        "200": { description: "Token und Benutzer { id, email, name, role, employee_id }" }
        "401":
          description: Ungültige Zugangsdaten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/refresh:
    post:
      summary: Sitzung verlängern (neues Token derselben Sitzungsart)
      description: >-
        Gleiche Prüfungen wie jede angemeldete Route (Signatur, Ablauf,
        sessions_valid_from, Konto vorhanden, kein erzwungener Passwortwechsel).
        Die Sitzungsart desktop bleibt nur erhalten, solange das Konto role admin
        hat; ein Token ohne Sitzungsart gilt als portal. Auch im
        Nur-Lese-Betrieb der Lizenz erreichbar. Kein Audit-Eintrag. Der Beginn
        der Sitzung (Claim auth_time) bleibt erhalten; nach der Höchstdauer
        (OHRGANIZE_SESSION_MAX, Vorgabe 6h; Desktop
        OHRGANIZE_DESKTOP_SESSION_MAX, Vorgabe 5d) gibt es kein neues Token
        mehr, und jedes Token läuft spätestens zum Ende der Sitzung ab
        (Claim session_end).
      responses:
        "200": { description: "{ token }" }
        "401":
          description: Token abgelaufen, entwertet, Konto gelöscht oder Höchstdauer der Sitzung erreicht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Erzwungener Passwortwechsel steht aus (PASSWORD_CHANGE_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/me:
    get:
      summary: Angemeldeter Benutzer
      responses:
        "200": { description: Benutzer }
  /api/regions:
    get:
      summary: "Regionen eines Landes (Vorgabe: Land der Variante)"
      description: >-
        Nachschlagewerk fuer Auswahlfelder. Das Land der Installation kommt aus
        der Variante (Build), nicht aus einer Einstellung; der Parameter dient
        nur dem Nachschlagen anderer Kataloge.
      parameters:
        - { name: country, in: query, schema: { type: string, enum: [DE, AT, CH] } }
      responses:
        "200": { description: "{ country, country_label, regions: { code: name } }" }
  /api/bundeslaender:
    get:
      summary: Alias von /api/regions fuer das Land der Variante
      responses:
        "200": { description: "{ bundeslaender: { code: name } }" }
  /api/setup/status:
    get:
      summary: Stand des Einrichtungs-Assistenten (nur Zaehlungen, abgeleitet aus den Daten)
      description: >-
        Jedes Admin-Konto darf die Route aufrufen. Die Rechte werden je Block
        geprueft: Felder gesperrter Bereiche fehlen in der Antwort (nie 0),
        allowed_areas nennt die lesbaren Bereiche. portal_users zaehlt jedes Konto mit
        Personalprofil (auch Admin-Konten, die sich damit im Portal anmelden
        koennen), ausser dem abfragenden Konto. employees_without_account
        verlangt zusaetzlich das Leserecht auf personal. Gespeichert wird nichts.
      responses:
        "200": { description: "{ allowed_areas, company_saved?, locations?, departments?, employees_active?, employees_with_manager?, absence_types_active?, admin_users?, portal_users?, employees_without_account? }" }
  /api/holidays/{year}/{land}:
    get:
      summary: Gesetzliche Feiertage eines Jahres in einer Region
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: land, in: path, required: true, schema: { type: string } }
        - { name: country, in: query, schema: { type: string, enum: [DE, AT, CH] } }
      responses:
        "200": { description: "{ holidays: [{ date, name }] }" }
        "400":
          description: Region gehoert nicht zum Land
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/files/{id}/download:
    get:
      summary: Datei-Download über kurzlebige signierte URL (beide Clients identisch)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Dateiinhalt }

  # ---------------------------------------------------------------------------
  # Self-Service-Endpunkte des Mitarbeitenden-Web-Portals (/api/me/*).
  # Alle Routen setzen einen Account mit verknüpftem Personalprofil voraus
  # (users.employee_id) und liefern ausschließlich eigene Daten.
  # Einträge mit x-status: planned sind weiterhin nur reserviert.
  # ---------------------------------------------------------------------------
  /api/me/profile:
    get:
      summary: Eigene Stammdaten lesen (ohne Bank-/Steuerdaten)
      responses:
        "200": { description: "{ profile } inkl. Abteilungs-/Team-/Standortnamen" }
        "403":
          description: Kein verknüpftes oder kein aktives Personalprofil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    # Ein direktes PATCH auf das eigene Profil gibt es bewusst NICHT: Die
    # Personalakte ist Grundlage für Abrechnung und Meldungen, jede Änderung
    # läuft als Antrag über /api/me/change-requests und wird in der
    # Personalabteilung entschieden.
  /api/me/change-request-fields:
    get:
      summary: Selbst beantragbare Stammdatenfelder (Allowlist EMPLOYEE_SELF_EDITABLE_FIELDS)
      responses:
        "200": { description: "{ fields } je Feld mit label, group, input, maxLength, confidential, hint" }
  /api/me/change-requests:
    get:
      summary: Eigene Änderungsanträge zu den Stammdaten (Bankwerte gekürzt)
      responses:
        "200": { description: "{ requests } neueste zuerst, je Antrag fields mit old_value/new_value (bei Bankfeldern masked)" }
    post:
      summary: "Änderung der eigenen Stammdaten beantragen — Body { fields: {spalte: wert|null}, note? }"
      responses:
        "201": { description: "{ request } mit Status beantragt" }
        "400":
          description: Feld nicht beantragbar, Wert ungültig oder gegenüber dem hinterlegten Stand unverändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Es liegt bereits ein offener Antrag vor (höchstens einer je Person)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/change-requests/{id}/withdraw:
    post:
      summary: Eigenen, noch offenen Änderungsantrag zurückziehen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ request } mit Status zurueckgezogen" }
        "404":
          description: Antrag unbekannt oder fremd (404 statt 403 — ein 403 verriete seine Existenz)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Antrag ist bereits entschieden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/documents:
    get:
      x-status: planned
      summary: Eigene Dokumente auflisten
      responses: { "200": { description: Dokumentliste } }
  /api/me/leave-types:
    get:
      summary: Beantragbare Abwesenheitsarten (aktiv, ohne Kategorie Krankheit)
      responses:
        "200": { description: "{ types }" }
  /api/me/leave-requests:
    get:
      summary: Eigene Abwesenheitsanträge einsehen
      parameters:
        - { name: year, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ requests } inkl. type_name/type_color/decided_by_name" }
    post:
      summary: Abwesenheit beantragen (Urlaub/Sonderabwesenheit)
      responses:
        "201": { description: "{ request } — bei genehmigungsfreien Arten direkt genehmigt" }
        "409":
          description: Überschneidung oder Jahresobergrenze überschritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/leave-requests/{id}/cancel:
    post:
      summary: Eigenen, noch offenen Antrag zurückziehen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ request } mit Status storniert" }
        "409":
          description: Antrag ist nicht mehr offen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/me/leave-balance:
    get:
      summary: Eigenen Urlaubssaldo einsehen
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: "{ balance }" }
  /api/me/leave-preview:
    get:
      summary: Live-Vorschau der gezählten Tage für das Antragsformular
      parameters:
        - { name: date_from, in: query, required: true, schema: { type: string } }
        - { name: date_to, in: query, required: true, schema: { type: string } }
        - { name: half_day_start, in: query, required: false, schema: { type: string } }
        - { name: half_day_end, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "{ days_counted, bundesland }" }
  /api/me/sick-notes:
    get:
      summary: Eigene Krankmeldungen einsehen (inkl. AU-Frist)
      responses:
        "200": { description: "{ sick_notes }" }
    post:
      summary: Krankmeldung einreichen (AU-Nachweis reicht die HR nach)
      responses:
        "201": { description: "{ sick_note } inkl. certificate_due_date" }
  /api/me/team-calendar:
    get:
      x-status: planned
      summary: Abwesenheitskalender des eigenen Teams
      responses: { "200": { description: Kalenderdaten } }
  /api/me/goals:
    get:
      x-status: planned
      summary: Eigene Ziele und Fortschritt einsehen
      responses: { "200": { description: Zielliste } }
  /api/me/reviews:
    get:
      x-status: planned
      summary: Eigene Beurteilungen einsehen
      responses: { "200": { description: Beurteilungen } }
  /api/me/announcements:
    get:
      summary: >-
        Aktive Ankündigungen an die angemeldete Person (Zielgruppe wie in der
        HR-Verwaltung aufgelöst, Abteilung samt Unterabteilungen, Verteiler),
        mit eigener Lesebestätigung und signierten Anhang-Links
      responses: { "200": { description: Ankündigungen } }
  /api/me/announcements/{id}/ack:
    post:
      summary: Ankündigung als gelesen bestätigen (idempotent; 404 außerhalb der Zielgruppe)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { "204": { description: Bestätigt } }
  /api/me/announcements/{id}/attachments/{fileId}/sign:
    post:
      summary: Anhang einer eigenen Ankündigung signieren (kurzlebige Download-URL; 404 außerhalb der Zielgruppe)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      responses: { "200": { description: Signierte URL } }
  /api/me/surveys:
    get:
      summary: Laufende Umfragen an die angemeldete Person mit Teilnahmestatus (Status laufend und Enddatum nicht überschritten)
      responses: { "200": { description: Umfragen } }
  /api/me/surveys/{id}:
    get:
      summary: Umfrage mit Fragen (nur laufend und in der Zielgruppe, sonst 404)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { "200": { description: Umfrage } }
  /api/me/surveys/{id}/responses:
    post:
      summary: >-
        An Umfrage teilnehmen. Die Person kommt aus dem Konto; Antworten werden
        ohne Personenbezug gespeichert, die Teilnahme getrennt markiert (409 bei
        zweiter Teilnahme).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { "201": { description: Teilnahme gespeichert } }
