# Modul Personalverwaltung & Stammdaten — Pfad-Fragment (Merge via npm run openapi).
paths:
  /api/employees:
    get:
      summary: Mitarbeitende auflisten (Suche, Filter, fields=lite für Modul-Kontrakt)
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Volltextsuche über alle relevanten Stammdatenfelder }
        - { name: status, in: query, schema: { type: string, enum: [aktiv, ausgeschieden] } }
        - { name: employee_type, in: query, schema: { type: string } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: team_id, in: query, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer } }
        - { name: fields, in: query, schema: { type: string, enum: [lite, full] } }
      responses:
        "200": { description: "{ employees: [...] }" }
    post:
      summary: Mitarbeiter:in anlegen (typabhängige Pflichtfelder serverseitig validiert; photo_file_id = Original, photo_thumb_file_id = Vorschaubild dazu)
      responses:
        "201": { description: Angelegte:r Mitarbeiter:in }
        "400": { description: Validierungsfehler (u. a. EMPLOYEE_TYPE_RULES, Vorschaubild ohne Foto) }
  /api/employees/export.csv:
    get:
      summary: CSV-Export der Stammdaten (BOM + Semikolon, gleiche Filter wie Liste)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: employee_type, in: query, schema: { type: string } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: team_id, in: query, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: CSV-Datei
          content:
            text/csv: {}
  /api/employees/bulk:
    post:
      summary: Massenbearbeitung (nur department_id, team_id, location_id, manager_id, status, weekly_hours, annual_leave_days; transaktional, auditiert)
      responses:
        "200": { description: "{ updated: n }" }
        "400": { description: "Unzulässiges Feld, Typregel-Verletzung oder Team passt nicht zur Abteilung" }
  /api/employees/change-requests:
    get:
      summary: Änderungsanträge Mitarbeitender zu ihren Stammdaten (offene zuerst, Bankwerte ungekürzt)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [beantragt, genehmigt, abgelehnt, zurueckgezogen] } }
        - { name: employee_id, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ requests: [...], open_count } inkl. Name, Personalnummer, Antragsteller:in und Entscheider:in" }
  /api/employees/change-requests/{id}/decide:
    post:
      summary: "Antrag genehmigen/ablehnen — Body { decision, decision_note? }; Genehmigung schreibt die Personalakte transaktional (auditiert)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ request } mit Entscheidung, decided_at und decision_note" }
        "400": { description: Selbstgenehmigung (Vier-Augen-Prinzip) oder Ablehnung ohne Begründung }
        "404": { description: Antrag nicht gefunden }
        "409": { description: Antrag ist bereits entschieden }
  /api/employees/{id}:
    get:
      summary: Mitarbeiter:in mit Organisationskontext und Reporting-Line
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ employee, reporting_line }" }
        "404": { description: Nicht gefunden }
    patch:
      summary: "Stammdaten teilweise ändern (Typregeln gelten für den gemergten Stand). Ein neues oder entferntes photo_file_id ohne photo_thumb_file_id setzt das Vorschaubild auf null; ersetzte Foto- und Vorschaudateien werden aufgeräumt (Audit: removed_file, removed_thumb_file)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Aktualisierte:r Mitarbeiter:in }
        "400": { description: Validierungsfehler (u. a. Vorschaubild ohne Foto) }
    delete:
      summary: "Mitarbeiter:in endgültig löschen: Verträge, Dokumente, Abwesenheiten, Gehaltsdaten und Bewertungen fallen per CASCADE, nicht mehr referenzierte Dateien werden aus dem Storage entfernt"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
  /api/employees/{id}/contracts:
    get:
      summary: Vertragshistorie eines Mitarbeitenden (neueste zuerst)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ contracts: [...] }" }
    post:
      summary: Neue Vertragsversion (schließt die offene Vorversion auf den Vortag; spiegelt Stunden/Urlaub auf employees)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: Neue Version }
        "409": { description: valid_from liegt nicht nach dem Beginn der offenen Version }
  /api/contracts/{id}:
    patch:
      summary: Korrektur ausschließlich der aktuellen Vertragsversion (jüngste Version, offen oder befristet mit Ende heute oder später)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Korrigierte Version }
        "400": { description: Gespiegelte Wochenstunden/Urlaubstage verletzen die Typregeln der Person }
        "409": { description: Version ist abgelaufen oder abgelöst (Historie) }
  /api/org/tree:
    get:
      summary: Organisationsbaum (Abteilungen → Teams) mit Mitarbeiterzahlen
      responses:
        "200": { description: "{ tree: [...], unassigned_count }" }
  /api/org/chart:
    get:
      summary: Personen-Organigramm (aktive Mitarbeitende mit Berichtslinie aus Vorgesetzten-, Team- oder Abteilungsleitung, Fotos signiert)
      responses:
        "200": { description: "{ people: [...], departments: [...] }; photo_url zeigt auf das Vorschaubild (photo_thumb_file_id, sonst photo_file_id) und bleibt innerhalb eines Zehn-Minuten-Fensters gleich" }
  /api/org/chart/originals:
    get:
      summary: "Signierte Links auf die Original-Fotos des Organigramms (nur Personen mit Vorschaubild), für hohen Zoom; befristet wie photo_url, ohne Audit-Zeile"
      responses:
        "200": { description: "{ originals: { <personen-id>: url } }" }
  /api/departments:
    get:
      summary: Abteilungen auflisten
      responses:
        "200": { description: "{ departments: [...] }" }
    post:
      summary: Abteilung anlegen
      responses:
        "201": { description: Abteilung }
  /api/departments/{id}:
    patch:
      summary: Abteilung ändern/umhängen (Zyklen-Check serverseitig)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Abteilung }
        "409": { description: Umhängen würde einen Zyklus erzeugen }
    delete:
      summary: Abteilung löschen (Zuordnungen von Teams und Mitarbeitenden werden gelöst; mit Unterabteilungen nicht löschbar)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
        "409": { description: Abteilung hat noch Unterabteilungen }
  /api/teams:
    get:
      summary: Teams auflisten
      responses:
        "200": { description: "{ teams: [...] }" }
    post:
      summary: Team anlegen
      responses:
        "201": { description: Team }
  /api/teams/{id}:
    patch:
      summary: Team ändern/in andere Abteilung umhängen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Team }
    delete:
      summary: Team löschen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
  /api/locations:
    get:
      summary: Standorte auflisten (inkl. country und bundesland für Feiertage)
      responses:
        "200": { description: "{ locations: [...] }" }
    post:
      summary: >-
        Standort anlegen. country ist ISO-2 (Vorgabe: Land der Variante),
        bundesland ein Regionscode DIESES Landes.
      responses:
        "201": { description: Standort }
        "400":
          description: Region gehoert nicht zum Land des Standorts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/locations/{id}:
    patch:
      summary: Standort ändern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Standort }
    delete:
      summary: Standort löschen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
  /api/documents:
    get:
      summary: Dokumente auflisten (FTS5-Volltextsuche über Metadaten, Kategorie-/Mitarbeiterfilter)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [vertrag, zeugnis, zertifikat, bescheinigung, abmahnung, sonstiges] } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: source, in: query, schema: { type: string, enum: [hr, portal] }, description: Herkunft (HR-Upload oder aus dem Portal) }
        - { name: include_superseded, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: "Seitengröße, höchstens 500 (größere Werte werden gedeckelt). Ohne limit ungeblättert: alle Treffer, ohne total." }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: Nur mit limit. Anzahl übersprungener Treffer. }
        - { name: focus_id, in: query, schema: { type: integer }, description: "Nur mit limit. Liefert die Seite, auf der dieses Dokument steht (passt es zu den Filtern); offset der Antwort nennt ihren Beginn." }
      responses:
        "200": { description: "{ documents: [...] } sortiert nach created_at und id absteigend; mit limit zusätzlich total (Treffer über alle Seiten) und offset (Beginn der gelieferten Seite)" }
    post:
      summary: Dokument-Metadaten anlegen (Datei zuvor über POST /api/files hochladen; Versionierung via supersedes_id; visibility portal|hr — hr bleibt im Portal unsichtbar)
      responses:
        "201": { description: Dokument }
  /api/documents/expiring:
    get:
      summary: Ablaufende Dokumente (expiry_date innerhalb reminder_days, nur aktuelle Versionen)
      responses:
        "200": { description: "{ documents: [...] }" }
  /api/documents/{id}:
    patch:
      summary: Dokument-Metadaten ändern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Dokument }
    delete:
      summary: Dokument löschen (Metadaten; Datei bleibt im Storage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
