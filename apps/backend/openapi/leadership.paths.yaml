# Modul Führung & Bewertung — Pfade (Merge via npm run openapi).
#
# /api/leadership/me/* ist die Führungsfunktion: Zugriff nur für Konten, deren
# Personalprofil als Führungskraft freigeschaltet ist (unabhängig von der
# Admin-Rolle). Alle übrigen Pfade hängen am Rechtebereich `fuehrung`.
paths:
  /api/leadership/me/status:
    get:
      summary: Ist das angemeldete Konto eine freigeschaltete Führungskraft? (für jedes Admin-Konto beantwortbar)
      responses:
        "200": { description: "{ is_leader, employee_id, period, team_size, rated_count, protocols_readable }" }
  /api/leadership/me/team:
    get:
      summary: Eigener Zuständigkeitsbereich mit Stammdaten und Bewertungsstand im Zeitraum
      parameters:
        - { name: period, in: query, schema: { type: string }, description: "Zeitraumschlüssel der eingestellten Kadenz, z. B. 2026-Q3; ohne Angabe der aktuelle" }
      responses:
        "200": { description: "{ period, current_period, settings, categories, team (je Person mit history; photo_url zeigt auf das Vorschaubild photo_thumb_file_id, sonst photo_file_id, gleich innerhalb eines Zehn-Minuten-Fensters), scope (Abteilungen, Teams, Kopfzahl), history_periods }" }
        "403": { description: Konto ist keine freigeschaltete Führungskraft }
  /api/leadership/me/employees/{id}:
    get:
      summary: Bewertungsmaske einer Person aus dem eigenen Bereich (Bewertungen, alle Zeiträume, Protokoll)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ employee, period, current_period, periods, settings, categories, ratings, all_ratings, history }" }
        "403": { description: Person gehört nicht zum eigenen Zuständigkeitsbereich }
  /api/leadership/me/employees/{id}/ratings:
    put:
      summary: Bewertungsblöcke eines Zeitraums speichern (Upsert je Kategorie, jede Änderung wird protokolliert)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [period_key, ratings]
              properties:
                period_key: { type: string, example: "2026-Q3" }
                ratings:
                  type: array
                  items:
                    type: object
                    required: [category_id, score, comment]
                    properties:
                      category_id: { type: integer }
                      score: { type: integer, description: "1 … Maximum der wirksamen Skala" }
                      comment: { type: string, description: Pflichtkommentar }
      responses:
        "200": { description: "{ ratings } — Stand des Zeitraums" }
        "400": { description: "Ungültiger Zeitraum, Wert außerhalb der Skala, fehlender Kommentar, Zukunft" }
        "403": { description: Person gehört nicht zum eigenen Zuständigkeitsbereich }
  # Gespräche: Modul leadership UND communication (Routen in modules/leadership/meetingRoutes.ts).
  /api/leadership/me/employees/{id}/meetings:
    get:
      summary: Für die Führung freigegebene Gesprächsprotokolle einer Person aus dem eigenen Bereich (Stufen hr_vorgesetzte und hr_vorgesetzte_mitarbeiter, nur lesen)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ meetings } je Protokoll Datum, Anlass, Teilnehmende, Inhalt, Vereinbarungen, Wiedervorlage, released_to_employee (für die Person freigegeben), visible_to_employee (freigegeben und Portalkonto); ohne Autor" }
        "403": { description: "Person gehört nicht zum eigenen Zuständigkeitsbereich, oder das Konto kann die Zuständigkeit selbst verändern (personal, verwaltung, fuehrung, recruiting oder benutzer: bearbeiten) und hat kein kommunikation: lesen" }
  /api/leadership/me/meetings/follow-ups:
    get:
      summary: Fällige Wiedervorlagen aus den freigegebenen Protokollen des eigenen Bereichs
      responses:
        "200": { description: "{ meetings } nur id, employee_id, Name, meeting_date, occasion, follow_up_date (kein Protokolltext)" }
        "403": { description: "Konto ist keine freigeschaltete Führungskraft, oder Selbstschutz beim Lesen wie oben" }

  /api/leadership/settings:
    get:
      summary: Unternehmensweite Einstellungen (Kadenz, Skala, gegenseitige Verantwortung, automatische Zuordnung)
      responses:
        "200": { description: "{ settings }" }
    put:
      summary: Einstellungen ändern (Teilobjekt)
      responses:
        "200": { description: "{ settings }" }
  /api/leadership/categories:
    get:
      summary: Bewertungskategorien (inkl. inaktive, mit wirksamer Skala und Bewertungszahl)
      responses:
        "200": { description: "{ categories }" }
    post:
      summary: Kategorie anlegen (zentral, für alle Führungskräfte)
      responses:
        "201": { description: "{ category }" }
        "409": { description: Name bereits vergeben }
  /api/leadership/categories/reorder:
    post:
      summary: Reihenfolge setzen — { ids } muss jede Kategorie genau einmal enthalten
      responses:
        "200": { description: "{ categories }" }
  /api/leadership/categories/{id}:
    patch:
      summary: Kategorie ändern (Name, Beschreibung, eigene Skala, aktiv)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ category }" }
        "409": { description: Gesamtbewertung kann nicht deaktiviert werden }
    delete:
      summary: Kategorie löschen — nur ohne Bewertungen; sonst deaktivieren
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Gelöscht }
        "409": { description: Bereits bewertet oder Gesamtbewertung }
  /api/leadership/leaders:
    get:
      summary: Freigeschaltete Führungskräfte mit Konto-Status und Teamgröße
      responses:
        "200": { description: "{ leaders }" }
    post:
      summary: Personalprofil als Führungskraft freischalten
      responses:
        "201": { description: "{ leader, warnings }" }
        "403": { description: "Eigenes Profil (Selbstschutz), oder das Profil hat schon ein Desktop-Konto und das handelnde Konto hat die Rechte der Führungsfunktion nicht (kommunikation: lesen)" }
        "409": { description: "Bereits freigeschaltet, unzulässige gegenseitige Verantwortung, oder das Passwort des Desktop-Kontos hat jemand ohne diese Rechte ausgegeben (zuerst neu ausgeben)" }
  /api/leadership/leaders/{employeeId}:
    patch:
      summary: Freischaltung ändern (auto_scope, note)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ leader }" }
        "403": { description: Automatik der eigenen Freischaltung einschalten (Selbstschutz) }
    delete:
      summary: Freischaltung entziehen (Bewertungen und Protokoll bleiben; auch die eigene)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Entzogen }
  /api/leadership/leaders/{employeeId}/team:
    get:
      summary: Vorschau der Zuständigkeit (Team, manuelle Zuweisungen, gegenseitige Verantwortung)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ leader, team, assignments, mutual }" }
  /api/leadership/leaders/{employeeId}/breakdown:
    get:
      summary: Aufschlüsselung eines Report-Widgets — verantwortete Personen mit Gesamtbewertung je Zeitraum (ohne Kommentare)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string }, description: "Jüngste Spalte; ohne Angabe der aktuelle Zeitraum" }
        - { name: columns, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 }, description: Anzahl der Zeitraum-Spalten }
      responses:
        "200": { description: "{ leader, periods, scale, category, rows }" }
        "400": { description: Ungültiger Zeitraum oder unzulässige Spaltenzahl }
        "404": { description: Person ist nicht als Führungskraft freigeschaltet }
  /api/leadership/leaders/{employeeId}/employees/{memberId}/ratings:
    get:
      summary: Eine Bewertung vollständig — alle Kategorien des Zeitraums mit Kommentaren plus Protokoll (Detail-Pop-up des Reports)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer }, description: Führungskraft }
        - { name: memberId, in: path, required: true, schema: { type: integer }, description: Bewertete Person }
        - { name: period, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ employee, leader, period, ratings, history }" }
        "400": { description: Ungültiger Zeitraum }
        "404": { description: "Person ist keine Führungskraft, Mitarbeiter:in unbekannt, oder es liegt keine Bewertung dieser Führungskraft vor" }
  /api/leadership/leaders/{employeeId}/assignments:
    post:
      summary: Manuelle Zuweisung anlegen (include/exclude; Person, Abteilung, Team oder Fachrolle; optional befristet)
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: "{ assignment, warnings }" }
        "403": { description: Ergänzung für das eigene Profil (Selbstschutz) }
        "409": { description: Unzulässige gegenseitige Verantwortung }
  /api/leadership/assignments/{id}:
    delete:
      summary: Zuweisung entfernen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Entfernt }
        "403": { description: Ausnahme des eigenen Profils entfernen (Selbstschutz) }
  /api/leadership/lookup:
    get:
      summary: Auswahllisten der Einrichtung (aktive Mitarbeitende, Abteilungen, Teams, aktive Fachrollen) — im Bereich fuehrung
      responses:
        "200": { description: "{ employees, departments, teams, roles }" }
  /api/leadership/report:
    get:
      summary: Satisfaction-Report — Verteilung der Gesamtbewertung je Führungskraft im Zeitraum
      parameters:
        - { name: period, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ period, current_period, category, scale, leaders } (je Führungskraft photo_file_id, photo_thumb_file_id und photo_url wie unter /api/leadership/me/team)" }
  /api/leadership/employees/{id}/ratings:
    get:
      summary: Alle Bewertungen einer Person (von allen Führungskräften) samt Protokoll — Verwaltungssicht
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ratings, history }" }
