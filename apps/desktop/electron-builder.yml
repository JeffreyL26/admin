appId: de.ohrganize.app
productName: oHRganize
copyright: © 2026 jba-team

# Muss der tatsächlich installierten Electron-Version entsprechen: durch das
# npm-Workspace-Hoisting liegt electron im Root-node_modules und electron-builder
# kann die Range aus package.json nicht selbst auflösen.
#
# ZWEITE STELLE — nicht vergessen: Die Version steht auch in
# apps/desktop/package.json. Wer nur dort anhebt, baut weiter mit der alten
# Fassung, und der Installer trägt sie aus. Beim Anheben wegen einer
# Sicherheitslücke heißt das: Die Lücke bleibt im Auslieferungsstand, obwohl
# `npm audit` Ruhe gibt. Genau so ist es beim Sprung von 38 auf 42 beinahe
# passiert; scripts/build.mjs vergleicht beide Angaben seitdem und bricht bei
# Abweichung ab.
electronVersion: 42.11.2

# Kein Auto-Update: die App bringt keinen electron-updater mit. Ohne diese
# Zeile versucht electron-builder am Ende trotzdem, Update-Metadaten
# (latest.yml) für einen aus dem Git-Remote geratenen Provider zu schreiben,
# und bricht dabei ab — der Installer ist dann zwar fertig, der Build endet
# aber mit Exit-Code 1.
publish: null

directories:
  output: release
  buildResources: build

# Installername traegt die Variante (Land x Edition), damit ein Arbeitsplatz
# den Installer der passenden Serverausgabe bekommt; OHRGANIZE_VARIANT setzt
# scripts/dist.mjs vor dem Aufruf. appId und productName bleiben fuer alle
# Varianten gleich: Sonst spaltete sich %APPDATA%\oHRganize (config.json,
# Pin-Speicher, Einzelplatzdaten) je Variante auf, und NSIS aktualisierte
# nicht mehr in place.
artifactName: oHRganize-Setup-${version}-${env.OHRGANIZE_VARIANT}.${ext}

files:
  - dist/**
  - package.json

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: oHRganize
  license: build/lizenz.txt
  installerLanguages:
    - de_DE

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.png

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
