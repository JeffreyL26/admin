appId: de.hrmonic.app
productName: HRMONIC
copyright: © 2026 HRMONIC

# Muss der tatsächlich installierten Electron-Version entsprechen: durch das
# npm-Workspace-Hoisting liegt electron im Root-node_modules und electron-builder
# kann die Range aus package.json nicht selbst auflösen.
electronVersion: 38.8.6

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HRMONIC
  license: build/lizenz.txt
  installerLanguages:
    - de_DE

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.png

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
